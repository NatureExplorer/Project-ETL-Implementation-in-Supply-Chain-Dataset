version: '3'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-environment
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
    PYTHON_VERSION: 3.11.15
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./api_req:/opt/airflow/api_req
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-50000}"
  depends_on:
    - db
  networks:
    - my-network
  command: bash -c "airflow db migrate && airflow standalone"


services:
  db:
    container_name: postgres_container
    image: postgres:15
    ports:
      - "5000:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: cuaca
      POSTGRES_PASSWORD: cuaca
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    networks:
     - my-network

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com\
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_WWW_USER_CREATE: "true"


  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: 
      - "8000:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
      <<: *airflow-common
      command: ["airflow", "scheduler"]


